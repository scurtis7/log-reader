<section class="log-input">
  <div
    class="log-input__dropzone"
    [class.log-input__dropzone--active]="isDragOver"
    (dragover)="onDragOver($event)"
    (dragleave)="onDragLeave($event)"
    (drop)="onDrop($event)"
    (click)="fileInput.click()"
  >
    @if (fileName) {
      <p>Loaded file: <strong>{{ fileName }}</strong></p>
    } @else {
      <p>Drag &amp; drop a <strong>.json</strong> or <strong>.ndjson</strong> file here, or click to browse</p>
    }
    <input
      #fileInput
      type="file"
      accept=".json,.ndjson,application/json,text/plain"
      hidden
      (change)="onFileSelected($event)"
    />
  </div>

  <div class="log-input__divider">or paste content below</div>

  <textarea
    class="log-input__textarea"
    placeholder="Paste NDJSON or JSON log content here..."
    rows="6"
    [(ngModel)]="pastedText"
    (paste)="onPaste()"
  ></textarea>

  <div class="log-input__actions">
    <div class="log-input__buttons">
      <button type="button" class="log-input__button" (click)="format()">Format Logs</button>
      <button type="button" class="log-input__button log-input__button--secondary" (click)="clear()">Clear</button>
      <button
        type="button"
        class="log-input__button log-input__button--order"
        [class.log-input__button--secondary]="!reversed"
        [attr.aria-pressed]="reversed"
        (click)="toggleOrder()"
      >
        ⇅ {{ reversed ? 'Reversed order' : 'Original order' }}
      </button>
    </div>

    <div class="log-input__filters">
      @for (level of levelOptions; track level) {
        <label class="log-input__filter">
          <input type="checkbox" (change)="toggleLevel(level, $event)" />
          {{ level }}
        </label>
      }
    </div>
  </div>
</section>
